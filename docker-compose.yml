version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sport_postgres_db
    environment:
      POSTGRES_USER: sport_user
      POSTGRES_PASSWORD: sport_crypto_pass_2026
      POSTGRES_DB: _tracker_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: